version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_service
    volumes:
      - queuedb-data:/var/lib/backend_data
    networks:
      - app-net

  frontend:
    image: nginx:alpine
    container_name: frontend_service
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-net

volumes:
  queuedb-data:
    name: queuedb-data

networks:
  app-net:
    name: app-net
    driver: bridge